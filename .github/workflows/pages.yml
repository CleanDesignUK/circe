name: Publish CIRCE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: circe-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Check tracker and build standalone app
        run: |
          node scripts/check-tracker.mjs
          node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
